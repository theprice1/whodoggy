      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Button background -->
  <rect width="280" height="50" rx="25" fill="white" stroke="#E0E0E0" stroke-width="1" filter="url(#googleShadow)"/>

  <!-- Google G logo -->
  <g transform="translate(35, 25)">
    <circle cx="0" cy="0" r="10" fill="white"/>
    <path d="M0 -10 A 10 10 0 0 1 7.07 -7.07 L5 -5 A 6 6 0 0 0 0 -6 A 6 6 0 0 0 0 6 A 6 6 0 0 0 6 0 L6 -2 L2 -2 L2 2 L4 2 L4 0 A 10 10 0 0 1 0 -10 Z" fill="#4285F4"/>
