<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="securityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28A745;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#20C997;stop-opacity:1" />
    </linearGradient>
    <filter id="securityGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield background -->
  <path d="M12 2 L20 6 L20 12 C20 18 12 22 12 22 C12 22 4 18 4 12 L4 6 Z" fill="url(#securityGradient)" filter="url(#securityGlow)"/>

  <!-- Inner shield -->
  <path d="M12 4 L18 7 L18 12 C18 16.5 12 19.5 12 19.5 C12 19.5 6 16.5 6 12 L6 7 Z" fill="white" opacity="0.9"/>

  <!-- Lock icon -->
  <rect x="9" y="11" width="6" height="5" rx="1" fill="url(#securityGradient)"/>
  <rect x="10" y="12" width="4" height="3" rx="0.5" fill="white"/>

  <!-- Lock shackle -->
  <path d="M10 11 L10 9 C10 8 11 7 12 7 C13 7 14 8 14 9 L14 11" stroke="url(#securityGradient)" stroke-width="1.5" fill="none"/>

  <!-- Key hole -->
  <circle cx="12" cy="13.5" r="0.8" fill="url(#securityGradient)"/>
  <rect x="11.6" y="14" width="0.8" height="1" fill="url(#securityGradient)"/>

  <!-- Security dots around shield -->
  <circle cx="8" cy="8" r="1" fill="url(#securityGradient)" opacity="0.6"/>
  <circle cx="16" cy="8" r="1" fill="url(#securityGradient)" opacity="0.6"/>
  <circle cx="8" cy="16" r="1" fill="url(#securityGradient)" opacity="0.6"/>
  <circle cx="16" cy="16" r="1" fill="url(#securityGradient)" opacity="0.6"/>
</svg>
