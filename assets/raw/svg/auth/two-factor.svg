<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="twoFactorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D89EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9EF2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Phone outline -->
  <rect x="6" y="2" width="12" height="20" rx="3" fill="url(#twoFactorGradient)" stroke="#1E5AA8" stroke-width="1"/>
  <rect x="7" y="4" width="10" height="14" rx="1" fill="white"/>

  <!-- Screen with code -->
  <rect x="8" y="6" width="8" height="8" rx="1" fill="#F5F5F5"/>

  <!-- 2FA code display -->
  <text x="12" y="9" font-family="Monaco, Courier, monospace" font-size="3" text-anchor="middle" fill="#2D89EF" font-weight="bold">123</text>
  <text x="12" y="12" font-family="Monaco, Courier, monospace" font-size="3" text-anchor="middle" fill="#2D89EF" font-weight="bold">456</text>

  <!-- Home button -->
  <circle cx="12" cy="19" r="1.5" fill="white" stroke="#2D89EF" stroke-width="1"/>

  <!-- Security shield overlay -->
  <g transform="translate(18, 8)" opacity="0.9">
    <path d="M0 -4 L3 -2 L3 2 C3 4 0 6 0 6 C0 6 -3 4 -3 2 L-3 -2 Z" fill="#28A745"/>
    <path d="M-1 0 L0 1 L2 -1" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
