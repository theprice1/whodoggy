<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="darkCardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="320" height="180" rx="12" fill="#1E1E1E" stroke="#333333" stroke-width="1" filter="url(#darkCardShadow)"/>

  <!-- Header section -->
  <rect width="320" height="60" rx="12" fill="#2D2D2D"/>
  <rect y="48" width="320" height="12" fill="#2D2D2D"/>

  <!-- Dog avatar -->
  <circle cx="40" cy="30" r="18" fill="#F7B84B"/>
  <circle cx="35" cy="26" r="2" fill="#1E1E1E"/>
  <circle cx="45" cy="26" r="2" fill="#1E1E1E"/>
  <circle cx="35" cy="26" r="1" fill="#EAEAEA"/>
  <circle cx="45" cy="26" r="1" fill="#EAEAEA"/>
  <ellipse cx="40" cy="33" rx="1.5" ry="1" fill="#1E1E1E"/>

  <!-- Dog info -->
  <text x="70" y="25" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#EAEAEA">Buddy</text>
  <text x="70" y="40" font-family="Inter, Arial, sans-serif" font-size="12" fill="#AAAAAA">Golden Retriever • Male • 3 years</text>

  <!-- Status indicator -->
  <circle cx="280" cy="30" r="6" fill="#28A745"/>
  <circle cx="280" cy="30" r="3" fill="#1E1E1E"/>
  <path d="M278 30 L280 32 L282 28" stroke="#28A745" stroke-width="1" fill="none"/>

  <!-- Content section -->
  <g transform="translate(20, 80)">
    <!-- Microchip info -->
    <rect x="0" y="0" width="16" height="12" rx="2" fill="#4799F0" opacity="0.2"/>
    <rect x="2" y="2" width="12" height="8" rx="1" fill="#4799F0"/>
    <rect x="3" y="3" width="10" height="6" rx="0.5" fill="#1E1E1E"/>
    <line x1="4" y1="5" x2="13" y2="5" stroke="#4799F0" stroke-width="0.5"/>
    <line x1="4" y1="6.5" x2="13" y2="6.5" stroke="#4799F0" stroke-width="0.5"/>
    <line x1="4" y1="8" x2="13" y2="8" stroke="#4799F0" stroke-width="0.5"/>

    <text x="25" y="8" font-family="Inter, Arial, sans-serif" font-size="11" fill="#AAAAAA">Microchip</text>
    <text x="25" y="20" font-family="Monaco, Courier, monospace" font-size="10" fill="#EAEAEA" font-weight="500">956000012345678</text>

    <!-- Registry info -->
    <text x="0" y="40" font-family="Inter, Arial, sans-serif" font-size="11" fill="#AAAAAA">Registry</text>
    <text x="0" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#EAEAEA" font-weight="500">PetPoint Database</text>

    <!-- Last updated -->
    <text x="0" y="72" font-family="Inter, Arial, sans-serif" font-size="10" fill="#666">Last updated: 2 hours ago</text>
  </g>

  <!-- Action buttons -->
  <g transform="translate(240, 140)">
    <circle cx="0" cy="0" r="12" fill="#F7B84B" opacity="0.2"/>
    <path d="M-4 -4 L-1 -1 L4 -6" stroke="#F7B84B" stroke-width="1.5" fill="none"/>

    <circle cx="30" cy="0" r="12" fill="#4799F0" opacity="0.2"/>
    <rect x="26" y="-3" width="8" height="6" rx="1" fill="none" stroke="#4799F0" stroke-width="1"/>
    <path d="M26 -1 L30 2 L34 -1" stroke="#4799F0" stroke-width="1" fill="none"/>
  </g>
</svg>
