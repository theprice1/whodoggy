<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="homeDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4799F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA3F2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- House structure -->
  <path d="M3 12 L12 3 L21 12 L21 20 C21 21 20 22 19 22 L5 22 C4 22 3 21 3 20 Z" fill="url(#homeDarkGradient)" stroke="#6BB3F5" stroke-width="0.5"/>

  <!-- House interior -->
  <path d="M5 12 L12 5 L19 12 L19 20 L5 20 Z" fill="#1E1E1E" opacity="0.9"/>

  <!-- Door -->
  <rect x="10" y="14" width="4" height="6" rx="2" fill="url(#homeDarkGradient)"/>
  <rect x="11" y="15" width="2" height="4" rx="1" fill="#1E1E1E"/>

  <!-- Windows -->
  <rect x="6" y="13" width="2.5" height="2.5" rx="0.5" fill="url(#homeDarkGradient)"/>
  <rect x="15.5" y="13" width="2.5" height="2.5" rx="0.5" fill="url(#homeDarkGradient)"/>

  <!-- Window panes -->
  <line x1="7.25" y1="13" x2="7.25" y2="15.5" stroke="#1E1E1E" stroke-width="0.3"/>
  <line x1="6" y1="14.25" x2="8.5" y2="14.25" stroke="#1E1E1E" stroke-width="0.3"/>
  <line x1="16.75" y1="13" x2="16.75" y2="15.5" stroke="#1E1E1E" stroke-width="0.3"/>
  <line x1="15.5" y1="14.25" x2="18" y2="14.25" stroke="#1E1E1E" stroke-width="0.3"/>

  <!-- Roof highlight -->
  <path d="M12 3 L21 12 L19 12 L12 5 L5 12 L3 12 Z" fill="url(#homeDarkGradient)" opacity="0.3"/>

  <!-- Door handle -->
  <circle cx="13" cy="17" r="0.3" fill="#F7B84B"/>
</svg>
