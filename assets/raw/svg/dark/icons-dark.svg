<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="300" height="200" fill="#121212"/>

  <!-- Title -->
  <text x="150" y="20" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#EAEAEA">Dark Mode Icon Set</text>

  <!-- Navigation icons row -->
  <g transform="translate(0, 40)">
    <!-- Home Dark -->
    <g transform="translate(30, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <path d="M-8 2 L0 -6 L8 2 L8 8 L4 8 L4 2 L-4 2 L-4 8 L-8 8 Z" fill="#4799F0"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Home</text>
    </g>

    <!-- Search Dark -->
    <g transform="translate(90, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <circle cx="0" cy="-2" r="6" fill="none" stroke="#4799F0" stroke-width="2"/>
      <line x1="4" y1="2" x2="8" y2="6" stroke="#4799F0" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Search</text>
    </g>

    <!-- Scan Dark -->
    <g transform="translate(150, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="none" stroke="#F7B84B" stroke-width="2"/>
      <rect x="-5" y="-5" width="3" height="3" fill="#F7B84B"/>
      <rect x="2" y="-5" width="3" height="3" fill="#F7B84B"/>
      <rect x="-5" y="2" width="3" height="3" fill="#F7B84B"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Scan</text>
    </g>

    <!-- Profile Dark -->
    <g transform="translate(210, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <circle cx="0" cy="-4" r="4" fill="none" stroke="#4799F0" stroke-width="2"/>
      <path d="M-6 6 Q0 2 6 6" stroke="#4799F0" stroke-width="2" fill="none"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Profile</text>
    </g>

    <!-- Settings Dark -->
    <g transform="translate(270, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <circle cx="0" cy="0" r="3" fill="none" stroke="#4799F0" stroke-width="1.5"/>
      <path d="M0 -8 L1 -5 L4 -5 L2 -3 L3 0 L0 -2 L-3 0 L-2 -3 L-4 -5 L-1 -5 Z" fill="#4799F0"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Settings</text>
    </g>
  </g>

  <!-- Action icons row -->
  <g transform="translate(0, 100)">
    <!-- Add Dark -->
    <g transform="translate(30, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#28A745" stroke-width="2"/>
      <path d="M0 -4 L0 4 M-4 0 L4 0" stroke="#28A745" stroke-width="2" stroke-linecap="round"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Add</text>
    </g>

    <!-- Edit Dark -->
    <g transform="translate(90, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <path d="M6 -6 L2 -2 L-6 6 L-6 8 L-4 8 L4 0 L8 -4 L6 -6 Z" fill="#F7B84B"/>
      <circle cx="6" cy="-6" r="1" fill="#333"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Edit</text>
    </g>

    <!-- Delete Dark -->
    <g transform="translate(150, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <rect x="-4" y="-2" width="8" height="10" rx="1" fill="#DC3545"/>
      <rect x="-3" y="-4" width="6" height="1" fill="#DC3545"/>
      <path d="M-2 -4 L-2 -6 L2 -6 L2 -4" stroke="#DC3545" stroke-width="1" fill="none"/>
      <line x1="-1" y1="1" x2="-1" y2="5" stroke="#1E1E1E" stroke-width="0.5"/>
      <line x1="1" y1="1" x2="1" y2="5" stroke="#1E1E1E" stroke-width="0.5"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Delete</text>
    </g>

    <!-- Share Dark -->
    <g transform="translate(210, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <path d="M0 -6 L6 0 L0 6" stroke="#4799F0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 0 L-8 0" stroke="#4799F0" stroke-width="2" stroke-linecap="round"/>
      <circle cx="6" cy="0" r="1.5" fill="#F7B84B"/>
      <circle cx="-8" cy="0" r="1.5" fill="#4799F0"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Share</text>
    </g>

    <!-- Success Dark -->
    <g transform="translate(270, 20)">
      <rect x="-15" y="-15" width="30" height="30" rx="4" fill="#1E1E1E" stroke="#333" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="none" stroke="#28A745" stroke-width="2"/>
      <path d="M-3 0 L0 3 L5 -2" stroke="#28A745" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="25" font-family="Arial" font-size="8" text-anchor="middle" fill="#AAAAAA">Success</text>
    </g>
  </g>

  <!-- Footer note -->
  <text x="150" y="180" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">Dark mode optimized for better night visibility</text>
</svg>
