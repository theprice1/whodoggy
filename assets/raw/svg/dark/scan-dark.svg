<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scanDarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7B84B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9C974;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- QR Code outline -->
  <rect x="4" y="4" width="16" height="16" rx="2" fill="#1E1E1E" stroke="url(#scanDarkGradient)" stroke-width="2"/>

  <!-- QR Code pattern -->
  <rect x="6" y="6" width="3" height="3" rx="0.5" fill="url(#scanDarkGradient)"/>
  <rect x="15" y="6" width="3" height="3" rx="0.5" fill="url(#scanDarkGradient)"/>
  <rect x="6" y="15" width="3" height="3" rx="0.5" fill="url(#scanDarkGradient)"/>

  <!-- Inner squares -->
  <rect x="7" y="7" width="1" height="1" fill="#1E1E1E"/>
  <rect x="16" y="7" width="1" height="1" fill="#1E1E1E"/>
  <rect x="7" y="16" width="1" height="1" fill="#1E1E1E"/>

  <!-- Data pattern -->
  <rect x="11" y="11" width="1" height="1" fill="url(#scanDarkGradient)"/>
  <rect x="13" y="11" width="1" height="1" fill="url(#scanDarkGradient)"/>
  <rect x="11" y="13" width="1" height="1" fill="url(#scanDarkGradient)"/>
  <rect x="15" y="13" width="1" height="1" fill="url(#scanDarkGradient)"/>

  <!-- Scanning line -->
  <rect x="4" y="11" width="16" height="1" fill="url(#scanDarkGradient)" opacity="0.8">
    <animate attributeName="y" values="4;19;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <path d="M2 2 L2 6 M2 2 L6 2" stroke="#4799F0" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 2 L22 6 M22 2 L18 2" stroke="#4799F0" stroke-width="2" stroke-linecap="round"/>
  <path d="M2 22 L2 18 M2 22 L6 22" stroke="#4799F0" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 22 L22 18 M22 22 L18 22" stroke="#4799F0" stroke-width="2" stroke-linecap="round"/>
</svg>
