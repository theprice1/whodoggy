<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkSplashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2D2D2D;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4799F0;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#F7B84B;stop-opacity:0.3" />
    </linearGradient>
    <filter id="darkGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="375" height="812" fill="url(#darkSplashBg)"/>

  <!-- Subtle dark pattern overlay -->
  <g opacity="0.05">
    <pattern id="darkQrPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="4" height="4" fill="#4799F0"/>
      <rect x="8" y="8" width="4" height="4" fill="#4799F0"/>
      <rect x="14" y="2" width="4" height="4" fill="#4799F0"/>
      <rect x="2" y="14" width="4" height="4" fill="#4799F0"/>
    </pattern>
    <rect width="375" height="812" fill="url(#darkQrPattern)"/>
  </g>

  <!-- Main logo -->
  <g transform="translate(187.5, 300)">
    <!-- Outer glow circle -->
    <circle cx="0" cy="0" r="80" fill="#4799F0" opacity="0.15" filter="url(#darkGlow)"/>

    <!-- Logo background -->
    <circle cx="0" cy="0" r="70" fill="#1E1E1E" opacity="0.95" stroke="#4799F0" stroke-width="2"/>

    <!-- WhoDoggy icon -->
    <circle cx="0" cy="0" r="50" fill="#4799F0" opacity="0.9"/>
    <circle cx="0" cy="0" r="35" fill="#1E1E1E" opacity="0.95"/>

    <!-- W letter -->
    <path d="M-20 -20 L-10 20 L-3 -8 L3 20 L10 -20 L3 -25 L-10 -25 Z" fill="#4799F0"/>

    <!-- Paw print -->
    <g transform="translate(20, -10)">
      <ellipse cx="0" cy="4" rx="8" ry="10" fill="#F7B84B"/>
      <circle cx="-10" cy="-5" r="4" fill="#F7B84B"/>
      <circle cx="-3" cy="-8" r="4" fill="#F7B84B"/>
      <circle cx="3" cy="-8" r="4" fill="#F7B84B"/>
      <circle cx="10" cy="-5" r="4" fill="#F7B84B"/>
    </g>
  </g>

  <!-- App title -->
  <text x="187.5" y="450" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle" fill="#EAEAEA" filter="url(#darkGlow)">WhoDoggy</text>

  <!-- Tagline -->
  <text x="187.5" y="480" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#AAAAAA" opacity="0.9">Dog Microchip Scanner</text>

  <!-- Connecting to databases text -->
  <text x="187.5" y="520" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#AAAAAA" opacity="0.7">Connecting to 22 databases worldwide</text>

  <!-- Loading indicator -->
  <g transform="translate(187.5, 600)">
    <circle cx="-20" cy="0" r="4" fill="#4799F0" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="4" fill="#4799F0" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="20" cy="0" r="4" fill="#4799F0" opacity="0.4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <!-- Version info -->
  <text x="187.5" y="750" font-family="Arial" font-size="10" text-anchor="middle" fill="#AAAAAA" opacity="0.6">Version 1.0</text>
</svg>
