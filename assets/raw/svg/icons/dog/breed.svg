<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dogGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7B84B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dog silhouette -->
  <path d="M4 16 C4 12 6 10 8 8 C9 7 10 6 12 6 C14 6 15 7 16 8 C18 10 20 12 20 16 C20 18 19 19 18 19 L6 19 C5 19 4 18 4 16 Z" fill="url(#dogGradient)"/>

  <!-- Dog head -->
  <circle cx="12" cy="8" r="4" fill="url(#dogGradient)"/>

  <!-- Ears -->
  <ellipse cx="9" cy="6" rx="1.5" ry="3" fill="url(#dogGradient)" transform="rotate(-30 9 6)"/>
  <ellipse cx="15" cy="6" rx="1.5" ry="3" fill="url(#dogGradient)" transform="rotate(30 15 6)"/>

  <!-- Eyes -->
  <circle cx="10.5" cy="7.5" r="0.8" fill="white"/>
  <circle cx="13.5" cy="7.5" r="0.8" fill="white"/>
  <circle cx="10.5" cy="7.5" r="0.4" fill="#333"/>
  <circle cx="13.5" cy="7.5" r="0.4" fill="#333"/>

  <!-- Nose -->
  <ellipse cx="12" cy="9" rx="0.8" ry="0.5" fill="#333"/>

  <!-- Tail -->
  <path d="M20 16 Q22 14 21 12 Q20 13 19 15" stroke="url(#dogGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
