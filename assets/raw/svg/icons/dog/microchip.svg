<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D89EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5A623;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Chip body -->
  <rect x="6" y="8" width="12" height="8" rx="1" fill="url(#chipGradient)" stroke="#1E5AA8" stroke-width="1"/>
  <rect x="7" y="9" width="10" height="6" rx="0.5" fill="white" opacity="0.9"/>

  <!-- Circuit lines -->
  <line x1="8" y1="11" x2="16" y2="11" stroke="#2D89EF" stroke-width="0.5"/>
  <line x1="8" y1="12.5" x2="16" y2="12.5" stroke="#2D89EF" stroke-width="0.5"/>
  <line x1="8" y1="14" x2="16" y2="14" stroke="#2D89EF" stroke-width="0.5"/>

  <!-- Pins -->
  <rect x="4" y="9" width="2" height="1" fill="#666"/>
  <rect x="4" y="11" width="2" height="1" fill="#666"/>
  <rect x="4" y="13" width="2" height="1" fill="#666"/>
  <rect x="4" y="15" width="2" height="1" fill="#666"/>

  <rect x="18" y="9" width="2" height="1" fill="#666"/>
  <rect x="18" y="11" width="2" height="1" fill="#666"/>
  <rect x="18" y="13" width="2" height="1" fill="#666"/>
  <rect x="18" y="15" width="2" height="1" fill="#666"/>

  <!-- Center indicator -->
  <circle cx="12" cy="12" r="1.5" fill="#F5A623"/>
</svg>
