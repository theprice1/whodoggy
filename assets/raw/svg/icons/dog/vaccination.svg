<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Syringe -->
  <rect x="3" y="10" width="15" height="4" rx="2" fill="#2D89EF" stroke="#1E5AA8" stroke-width="1"/>
  <rect x="4" y="11" width="13" height="2" rx="1" fill="white" opacity="0.8"/>

  <!-- Needle -->
  <rect x="18" y="11.5" width="4" height="1" fill="#666"/>
  <polygon points="22,11.5 24,12 22,12.5" fill="#333"/>

  <!-- Plunger -->
  <rect x="2" y="9.5" width="2" height="5" rx="1" fill="#F5A623"/>
  <circle cx="1" cy="12" r="1" fill="#F5A623"/>

  <!-- Measurement marks -->
  <line x1="6" y1="10.5" x2="6" y2="13.5" stroke="#2D89EF" stroke-width="0.5"/>
  <line x1="8" y1="10.5" x2="8" y2="13.5" stroke="#2D89EF" stroke-width="0.5"/>
  <line x1="10" y1="10.5" x2="10" y2="13.5" stroke="#2D89EF" stroke-width="0.5"/>
  <line x1="12" y1="10.5" x2="12" y2="13.5" stroke="#2D89EF" stroke-width="0.5"/>

  <!-- Liquid -->
  <rect x="5" y="11.2" width="8" height="1.6" rx="0.8" fill="#F5A623" opacity="0.6"/>
</svg>
