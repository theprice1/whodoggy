<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="loadingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D89EF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D89EF;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Spinner circle -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="#E0E0E0" stroke-width="2"/>

  <!-- Animated arc -->
  <circle cx="12" cy="12" r="9" fill="none" stroke="url(#loadingGradient)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 28" transform="rotate(0 12 12)">
    <animateTransform attributeName="transform" type="rotate" values="0 12 12;360 12 12" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
