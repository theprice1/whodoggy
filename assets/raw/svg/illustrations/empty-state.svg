<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#FAFAFA"/>

  <!-- Sleeping dog -->
  <g transform="translate(150, 120)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="40" ry="25" fill="#E0E0E0"/>

    <!-- Head -->
    <circle cx="-10" cy="0" r="20" fill="#E0E0E0"/>

    <!-- Ears - relaxed -->
    <ellipse cx="-20" cy="-8" rx="6" ry="10" fill="#E0E0E0" transform="rotate(-45 -20 -8)"/>
    <ellipse cx="-5" cy="-12" rx="5" ry="8" fill="#E0E0E0" transform="rotate(-10 -5 -12)"/>

    <!-- Closed eyes -->
    <path d="M-18 -3 Q-15 -1 -12 -3" stroke="#999" stroke-width="1.5" fill="none"/>
    <path d="M-8 -5 Q-5 -3 -2 -5" stroke="#999" stroke-width="1.5" fill="none"/>

    <!-- Nose -->
    <ellipse cx="-10" cy="2" rx="1" ry="0.8" fill="#999"/>

    <!-- Peaceful mouth -->
    <path d="M-12 4 Q-10 5 -8 4" stroke="#999" stroke-width="1" fill="none"/>

    <!-- Legs tucked under -->
    <ellipse cx="-15" cy="35" rx="8" ry="5" fill="#E0E0E0"/>
    <ellipse cx="10" cy="35" rx="8" ry="5" fill="#E0E0E0"/>

    <!-- Tail curled -->
    <path d="M35 25 Q45 15 40 5 Q35 10 30 20" stroke="#E0E0E0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- ZZZ sleep symbols -->
  <g opacity="0.6">
    <text x="200" y="70" font-family="Arial" font-size="12" fill="#999" font-style="italic">Z</text>
    <text x="210" y="60" font-family="Arial" font-size="16" fill="#999" font-style="italic">Z</text>
    <text x="220" y="45" font-family="Arial" font-size="20" fill="#999" font-style="italic">Z</text>
  </g>

  <!-- Cloud -->
  <g transform="translate(80, 50)" opacity="0.4">
    <circle cx="0" cy="10" r="8" fill="#E0E0E0"/>
    <circle cx="12" cy="10" r="10" fill="#E0E0E0"/>
    <circle cx="24" cy="10" r="8" fill="#E0E0E0"/>
    <rect x="0" y="10" width="24" height="8" fill="#E0E0E0"/>
  </g>

  <!-- Empty state text -->
  <text x="150" y="40" font-family="Poppins, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#999" font-weight="500">Nothing here yet</text>
  <text x="150" y="180" font-family="Arial" font-size="9" text-anchor="middle" fill="#999">Start by scanning a microchip</text>
</svg>
