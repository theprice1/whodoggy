<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with error tint -->
  <rect width="300" height="200" fill="#FFF5F5"/>

  <!-- Confused/worried dog -->
  <g transform="translate(150, 110)">
    <!-- Body -->
    <ellipse cx="0" cy="25" rx="32" ry="22" fill="#DC3545" opacity="0.3"/>
    <ellipse cx="0" cy="25" rx="30" ry="20" fill="#F5A623"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#F5A623"/>

    <!-- Ears - alert/worried -->
    <ellipse cx="-15" cy="-12" rx="6" ry="10" fill="#F5A623" transform="rotate(-10 -15 -12)"/>
    <ellipse cx="15" cy="-12" rx="6" ry="10" fill="#F5A623" transform="rotate(10 15 -12)"/>

    <!-- Worried eyes -->
    <circle cx="-7" cy="-3" r="3" fill="white"/>
    <circle cx="7" cy="-3" r="3" fill="white"/>
    <circle cx="-7" cy="-3" r="1.5" fill="#333"/>
    <circle cx="7" cy="-3" r="1.5" fill="#333"/>

    <!-- Worried eyebrows -->
    <path d="M-12 -8 L-4 -6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12 -8 L4 -6" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="0" cy="2" rx="1.5" ry="1" fill="#333"/>

    <!-- Worried mouth -->
    <path d="M-4 6 Q0 8 4 6" stroke="#333" stroke-width="1.5" fill="none"/>

    <!-- Paws covering face slightly -->
    <ellipse cx="-20" cy="5" rx="4" ry="6" fill="#F5A623" transform="rotate(-20 -20 5)"/>
    <ellipse cx="20" cy="5" rx="4" ry="6" fill="#F5A623" transform="rotate(20 20 5)"/>
  </g>

  <!-- Error symbol -->
  <g transform="translate(80, 60)">
    <circle cx="0" cy="0" r="15" fill="#DC3545"/>
    <circle cx="0" cy="0" r="12" fill="white"/>
    <line x1="-6" y1="-6" x2="6" y2="6" stroke="#DC3545" stroke-width="2"/>
    <line x1="6" y1="-6" x2="-6" y2="6" stroke="#DC3545" stroke-width="2"/>
  </g>

  <!-- Warning triangles -->
  <g transform="translate(220, 70)" opacity="0.6">
    <path d="M0 -8 L7 6 L-7 6 Z" fill="#FFC107"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="white" stroke-width="1"/>
    <circle cx="0" cy="4" r="0.8" fill="white"/>
  </g>

  <!-- Error text -->
  <text x="150" y="35" font-family="Poppins, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#DC3545" font-weight="600">Oops! Something went wrong</text>
  <text x="150" y="175" font-family="Arial" font-size="9" text-anchor="middle" fill="#666">Please try again or contact support</text>
</svg>
