<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#F8F9FA"/>

  <!-- Confused dog -->
  <g transform="translate(150, 100)">
    <!-- Body -->
    <ellipse cx="0" cy="35" rx="35" ry="25" fill="#F5A623"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="22" fill="#F5A623"/>

    <!-- Ears - droopy -->
    <ellipse cx="-15" cy="-10" rx="6" ry="12" fill="#F5A623" transform="rotate(-30 -15 -10)"/>
    <ellipse cx="15" cy="-10" rx="6" ry="12" fill="#F5A623" transform="rotate(30 15 -10)"/>

    <!-- Confused eyes -->
    <circle cx="-7" cy="-5" r="2.5" fill="white"/>
    <circle cx="7" cy="-5" r="2.5" fill="white"/>
    <circle cx="-7" cy="-5" r="1.2" fill="#333"/>
    <circle cx="7" cy="-5" r="1.2" fill="#333"/>

    <!-- Eyebrows - worried -->
    <path d="M-10 -10 L-4 -8" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M10 -10 L4 -8" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose -->
    <ellipse cx="0" cy="0" rx="1.5" ry="1" fill="#333"/>

    <!-- Mouth - concerned -->
    <path d="M-3 3 Q0 6 3 3" stroke="#333" stroke-width="1.5" fill="none"/>

    <!-- Question marks floating -->
    <g transform="translate(-40, -30)" opacity="0.7">
      <text x="0" y="0" font-family="Arial" font-size="20" fill="#2D89EF" font-weight="bold">?</text>
    </g>
    <g transform="translate(35, -25)" opacity="0.5">
      <text x="0" y="0" font-family="Arial" font-size="15" fill="#F5A623" font-weight="bold">?</text>
    </g>
    <g transform="translate(-30, 20)" opacity="0.6">
      <text x="0" y="0" font-family="Arial" font-size="18" fill="#2D89EF" font-weight="bold">?</text>
    </g>
  </g>

  <!-- Key -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="15" height="4" rx="2" fill="#F5A623"/>
    <circle cx="18" cy="2" r="6" fill="none" stroke="#F5A623" stroke-width="2"/>
    <circle cx="18" cy="2" r="3" fill="none" stroke="#F5A623" stroke-width="1"/>

    <!-- Key teeth -->
    <rect x="-3" y="1" width="2" height="2" fill="#F5A623"/>
    <rect x="-3" y="-1" width="1" height="2" fill="#F5A623"/>
  </g>

  <!-- Email icon -->
  <g transform="translate(220, 140)">
    <rect x="0" y="0" width="24" height="16" rx="2" fill="white" stroke="#2D89EF" stroke-w
