<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#F8F9FA"/>

  <!-- Detective dog -->
  <g transform="translate(150, 110)">
    <!-- Body -->
    <ellipse cx="0" cy="25" rx="30" ry="20" fill="#8B4513"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="18" fill="#8B4513"/>

    <!-- Detective hat -->
    <ellipse cx="0" cy="-15" rx="20" ry="8" fill="#2D89EF"/>
    <rect x="-15" y="-20" width="30" height="8" fill="#2D89EF"/>

    <!-- Ears -->
    <ellipse cx="-12" cy="-5" rx="5" ry="8" fill="#8B4513" transform="rotate(-20 -12 -5)"/>
    <ellipse cx="12" cy="-5" rx="5" ry="8" fill="#8B4513" transform="rotate(20 12 -5)"/>

    <!-- Eyes - searching -->
    <circle cx="-6" cy="-2" r="2.5" fill="white"/>
    <circle cx="6" cy="-2" r="2.5" fill="white"/>
    <circle cx="-6" cy="-2" r="1.2" fill="#333"/>
    <circle cx="6" cy="-2" r="1.2" fill="#333"/>

    <!-- Nose -->
    <ellipse cx="0" cy="3" rx="1.5" ry="1" fill="#333"/>

    <!-- Mustache -->
    <path d="M-8 5 Q-4 7 0 5 Q4 7 8 5" stroke="#333" stroke-width="1" fill="none"/>
  </g>

  <!-- Large magnifying glass -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#2D89EF" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="white" opacity="0.3"/>
    <line x1="18" y1="18" x2="35" y2="35" stroke="#F5A623" stroke-width="4" stroke-linecap="round"/>

    <!-- No results X -->
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#DC3545" stroke-width="2"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#DC3545" stroke-width="2"/>
  </g>

  <!-- Question marks -->
  <text x="220" y="60" font-family="Arial" font-size="18" fill="#999" font-weight="bold">?</text>
  <text x="240" y="90" font-family="Arial" font-size="14" fill="#999" font-weight="bold">?</text>

  <!-- No results text -->
  <text x="150" y="40" font-family="Poppins, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666" font-weight="600">No results found</text>
  <text x="150" y="180" font-family="Arial" font-size="9" text-anchor="middle" fill="#999">Try scanning a different microchip</text>
</svg>
