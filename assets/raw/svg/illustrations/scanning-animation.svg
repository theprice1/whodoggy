<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#F0F8FF"/>

  <!-- Dog with scanner -->
  <g transform="translate(150, 120)">
    <!-- Body -->
    <ellipse cx="0" cy="20" rx="28" ry="18" fill="#2D89EF"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="16" fill="#2D89EF"/>

    <!-- Ears -->
    <ellipse cx="-12" cy="-10" rx="5" ry="8" fill="#2D89EF" transform="rotate(-15 -12 -10)"/>
    <ellipse cx="12" cy="-10" rx="5" ry="8" fill="#2D89EF" transform="rotate(15 12 -10)"/>

    <!-- Focused eyes -->
    <circle cx="-5" cy="-2" r="2" fill="white"/>
    <circle cx="5" cy="-2" r="2" fill="white"/>
    <circle cx="-5" cy="-2" r="1" fill="#333"/>
    <circle cx="5" cy="-2" r="1" fill="#333"/>

    <!-- Nose -->
    <ellipse cx="0" cy="2" rx="1" ry="0.8" fill="#333"/>

    <!-- Concentrated mouth -->
    <path d="M-2 4 L2 4" stroke="#333" stroke-width="1"/>

    <!-- Scanner device in mouth -->
    <rect x="8" y="-2" width="15" height="6" rx="3" fill="#F5A623" stroke="#D4941C" stroke-width="1"/>
    <rect x="10" y="0" width="8" height="2" rx="1" fill="white"/>
    <circle cx="21" cy="1" r="1" fill="#28A745"/>
  </g>

  <!-- QR Code being scanned -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="40" height="40" fill="white" stroke="#333" stroke-width="1"/>

    <!-- QR pattern -->
    <rect x="2" y="2" width="6" height="6" fill="#333"/>
    <rect x="32" y="2" width="6" height="6" fill="#333"/>
    <rect x="2" y="32" width="6" height="6" fill="#333"/>

    <rect x="4" y="4" width="2" height="2" fill="white"/>
    <rect x="34" y="4" width="2" height="2" fill="white"/>
    <rect x="4" y="34" width="2" height="2" fill="white"/>

    <rect x="10" y="10" width="2" height="2" fill="#333"/>
    <rect x="14" y="10" width="2" height="2" fill="#333"/>
    <rect x="18" y="10" width="2" height="2" fill="#333"/>
    <rect x="26" y="10" width="2" height="2" fill="#333"/>
    <rect x="30" y="10" width="2" height="2" fill="#333"/>

    <rect x="10" y="14" width="2" height="2" fill="#333"/>
    <rect x="22" y="14" width="2" height="2" fill="#333"/>
    <rect x="30" y="14" width="2" height="2" fill="#333"/>

    <!-- Scanning beam -->
    <rect x="0" y="15" width="40" height="2" fill="#F5A623" opacity="0.8">
      <animate attributeName="y" values="0;35;0" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Scanning rays -->
  <g transform="translate(100, 100)" opacity="0.6">
    <line x1="0" y1="0" x2="30" y2="-10" stroke="#F5A623" stroke-width="2" opacity="0.8">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="30" y2="0" stroke="#F5A623" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="0" x2="30" y2="10" stroke="#F5A623" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="0.8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Scanning text -->
  <text x="150" y="40" font-family="Poppins, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2D89EF" font-weight="600">Scanning...</text>

  <!-- Loading dots -->
  <g transform="translate(150, 180)">
    <circle cx="-8" cy="0" r="2" fill="#F5A623">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="0" cy="0" r="2" fill="#F5A623">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="8" cy="0" r="2" fill="#F5A623">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
</svg>
