<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="signupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF3E0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" fill="url(#signupBg)"/>

  <!-- Multiple dogs -->
  <!-- Dog 1 -->
  <g transform="translate(60, 120)">
    <ellipse cx="0" cy="20" rx="25" ry="20" fill="#F5A623"/>
    <circle cx="0" cy="0" r="15" fill="#F5A623"/>
    <ellipse cx="-8" cy="-8" rx="5" ry="10" fill="#F5A623" transform="rotate(-15 -8 -8)"/>
    <ellipse cx="8" cy="-8" rx="5" ry="10" fill="#F5A623" transform="rotate(15 8 -8)"/>
    <circle cx="-5" cy="-2" r="2" fill="white"/>
    <circle cx="5" cy="-2" r="2" fill="white"/>
    <circle cx="-5" cy="-2" r="1" fill="#333"/>
    <circle cx="5" cy="-2" r="1" fill="#333"/>
    <ellipse cx="0" cy="3" rx="1.5" ry="1" fill="#333"/>
    <!-- Paw up -->
    <circle cx="-15" cy="5" r="4" fill="#F5A623"/>
  </g>

  <!-- Dog 2 -->
  <g transform="translate(150, 130)">
    <ellipse cx="0" cy="15" rx="20" ry="15" fill="#2D89EF"/>
    <circle cx="0" cy="0" r="12" fill="#2D89EF"/>
    <ellipse cx="-6" cy="-6" rx="4" ry="8" fill="#2D89EF" transform="rotate(-10 -6 -6)"/>
    <ellipse cx="6" cy="-6" rx="4" ry="8" fill="#2D89EF" transform="rotate(10 6 -6)"/>
    <circle cx="-4" cy="-1" r="1.5" fill="white"/>
    <circle cx="4" cy="-1" r="1.5" fill="white"/>
    <circle cx="-4" cy="-1" r="0.8" fill="#333"/>
    <circle cx="4" cy="-1" r="0.8" fill="#333"/>
    <ellipse cx="0" cy="2" rx="1" ry="0.8" fill="#333"/>
  </g>

  <!-- Dog 3 -->
  <g transform="translate(240, 125)">
    <ellipse cx="0" cy="18" rx="22" ry="18" fill="#28A745"/>
    <circle cx="0" cy="0" r="13" fill="#28A745"/>
    <ellipse cx="-7" cy="-7" rx="4.5" ry="9" fill="#28A745" transform="rotate(-20 -7 -7)"/>
    <ellipse cx="7" cy="-7" rx="4.5" ry="9" fill="#28A745" transform="rotate(20 7 -7)"/>
    <circle cx="-4.5" cy="-1.5" r="1.8" fill="white"/>
    <circle cx="4.5" cy="-1.5" r="1.8" fill="white"/>
    <circle cx="-4.5" cy="-1.5" r="0.9" fill="#333"/>
    <circle cx="4.5" cy="-1.5" r="0.9" fill="#333"/>
    <ellipse cx="0" cy="2.5" rx="1.2" ry="0.9" fill="#333"/>
  </g>

  <!-- Registration form preview -->
  <rect x="80" y="30" width="140" height="100" rx="8" fill="white" stroke="#2D89EF" stroke-width="2" opacity="0.9"/>

  <!-- Form title -->
  <text x="150" y="50" font-family="Poppins, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#2D89EF" font-weight="600">Join WhoDoggy</text>

  <!-- Form fields -->
  <rect x="90" y="60" width="120" height="12" rx="6" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="95" y="68" font-family="Arial" font-size="6" fill="#999">Email Address</text>

  <rect x="90" y="78" width="120" height="12" rx="6" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="95" y="86" font-family="Arial" font-size="6" fill="#999">Password</text>

  <rect x="90" y="96" width="120" height="12" rx="6" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
  <text x="95" y="104" font-family="Arial" font-size="6" fill="#999">Dog's Name</text>

  <!-- Sign up button -->
  <rect x="110" y="115" width="80" height="12" rx="6" fill="#F5A623"/>
  <text x="150" y="123" font-family="Poppins, Arial, sans-serif" font-size="7" text-anchor="middle" fill="white" font-weight="600">Sign Up</text>

  <!-- Hearts floating -->
  <g opacity="0.6">
    <path d="M40 40 C35 35 25 35 25 45 C25 50 35 60 40 65 C45 60 55 50 55 45 C55 35 45 35 40 40 Z" fill="#FF6B9D"/>
    <path d="M260 50 C257 47 252 47 252 52 C252 55 257 62 260 65 C263 62 268 55 268 52 C268 47 263 47 260 50 Z" fill="#FF6B9D"/>
  </g>
</svg>
