<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with success tint -->
  <rect width="300" height="200" fill="#F0FFF4"/>

  <!-- Happy dog -->
  <g transform="translate(150, 110)">
    <!-- Body -->
    <ellipse cx="0" cy="25" rx="32" ry="22" fill="#28A745" opacity="0.2"/>
    <ellipse cx="0" cy="25" rx="30" ry="20" fill="#F5A623"/>

    <!-- Head -->
    <circle cx="0" cy="0" r="20" fill="#F5A623"/>

    <!-- Ears - perky -->
    <ellipse cx="-15" cy="-15" rx="6" ry="12" fill="#F5A623" transform="rotate(-20 -15 -15)"/>
    <ellipse cx="15" cy="-15" rx="6" ry="12" fill="#F5A623" transform="rotate(20 15 -15)"/>

    <!-- Happy eyes -->
    <path d="M-10 -5 Q-7 -3 -4 -5" stroke="#333" stroke-width="1.5" fill="none"/>
    <path d="M4 -5 Q7 -3 10 -5" stroke="#333" stroke-width="1.5" fill="none"/>

    <!-- Nose -->
    <ellipse cx="0" cy="2" rx="1.5" ry="1" fill="#333"/>

    <!-- Big happy smile -->
    <path d="M-8 4 Q0 12 8 4" stroke="#333" stroke-width="2" fill="none"/>

    <!-- Tongue -->
    <ellipse cx="0" cy="8" rx="3" ry="2" fill="#FF69B4"/>

    <!-- Wagging tail motion -->
    <path d="M25 20 Q35 10 30 0" stroke="#F5A623" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M28 18 Q38 8 33 -2" stroke="#F5A623" stroke-width="6" stroke-linecap="round" opacity="0.4"/>

    <!-- Paws up in celebration -->
    <ellipse cx="-25" cy="0" rx="4" ry="6" fill="#F5A623" transform="rotate(-30 -25 0)"/>
    <ellipse cx="25" cy="0" rx="4" ry="6" fill="#F5A623" transform="rotate(30 25 0)"/>
  </g>

  <!-- Success checkmark -->
  <g transform="translate(80, 60)">
    <circle cx="0" cy="0" r="15" fill="#28A745"/>
    <circle cx="0" cy="0" r="12" fill="white"/>
    <path d="M-5 0 L-1 4 L6 -4" stroke="#28A745" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Celebration stars -->
  <g opacity="0.7">
    <path d="M220 50 L222 55 L227 55 L223 58 L225 63 L220 60 L215 63 L217 58 L213 55 L218 55 Z" fill="#F5A623"/>
    <path d="M250 80 L251 83 L254 83 L252 85 L253 88 L250 86 L247 88 L248 85 L246 83 L249 83 Z" fill="#2D89EF"/>
    <path d="M70 40 L71.5 44 L75.5 44 L72.5 46.5 L74 50.5 L70 48 L66 50.5 L67.5 46.5 L64.5 44 L68.5 44 Z" fill="#28A745"/>
  </g>

  <!-- Success text -->
  <text x="150" y="35" font-family="Poppins, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#28A745" font-weight="600">Success!</text>
  <text x="150" y="175" font-family="Arial" font-size="9" text-anchor="middle" fill="#666">Microchip information found</text>
</svg>
