<svg viewBox="0 0 280 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkIconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4799F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA3F2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkCombTextGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4799F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7B84B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark mode icon -->
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="30" fill="url(#darkIconGradient)" stroke="#6BB3F5" stroke-width="2"/>
    <circle cx="0" cy="0" r="22" fill="#1E1E1E" opacity="0.9"/>
    <path d="M-15 -15 L-8 15 L-3 -5 L3 15 L8 -15 L3 -20 L-8 -20 Z" fill="#4799F0"/>
    <g transform="translate(12, -8)">
      <ellipse cx="0" cy="3" rx="4" ry="5" fill="#F7B84B"/>
      <circle cx="-5" cy="-3" r="2" fill="#F7B84B"/>
      <circle cx="-2" cy="-5" r="2" fill="#F7B84B"/>
      <circle cx="2" cy="-5" r="2" fill="#F7B84B"/>
      <circle cx="5" cy="-3" r="2" fill="#F7B84B"/>
    </g>
  </g>

  <!-- Dark mode text -->
  <text x="100" y="50" font-family="Poppins, Arial, sans-serif" font-size="32" font-weight="700" fill="url(#darkCombTextGradient)">WhoDoggy</text>

  <!-- Dark mode tagline -->
  <text x="100" y="65" font-family="Inter, Arial, sans-serif" font-size="10" fill="#AAAAAA" opacity="0.8">Dog Microchip Scanner</text>
</svg>
