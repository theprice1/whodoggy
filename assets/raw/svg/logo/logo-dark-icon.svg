<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4799F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA3F2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Dark mode version -->
  <circle cx="50" cy="50" r="45" fill="url(#darkGradient)" stroke="#6BB3F5" stroke-width="2"/>
  <circle cx="50" cy="50" r="35" fill="#1E1E1E" opacity="0.9"/>
  
  <!-- W letter - lighter for dark mode -->
  <path d="M30 30 L35 55 L40 35 L45 55 L50 30 L45 25 L35 25 Z" fill="#4799F0" stroke="#6BB3F5" stroke-width="1"/>
  
  <!-- Paw print - brighter gold for dark mode -->
  <g transform="translate(55, 35)">
    <ellipse cx="0" cy="5" rx="6" ry="8" fill="#F7B84B"/>
    <circle cx="-8" cy="-5" r="3" fill="#F7B84B"/>
    <circle cx="-3" cy="-8" r="3" fill="#F7B84B"/>
    <circle cx="3" cy="-8" r="3" fill="#F7B84B"/>
    <circle cx="8" cy="-5" r="3" fill="#F7B84B"/>
  </g>
</svg>