<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D89EF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#4A9EF2;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#F5A623;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7B84B;stop-opacity:1" />
    </linearGradient>
    <filter id="webGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#webBg)"/>
  
  <!-- Hero content container -->
  <g transform="translate(600, 400)">
    <!-- Main logo - larger for web -->
    <g transform="translate(0, -80)">
      <circle cx="0" cy="0" r="100" fill="white" opacity="0.15" filter="url(#webGlow)"/>
      <circle cx="0" cy="0" r="85" fill="white" opacity="0.95"/>
      <circle cx="0" cy="0" r="65" fill="#2D89EF" opacity="0.9"/>
      <circle cx="0" cy="0" r="45" fill="white" opacity="0.95"/>
      
      <!-- W letter -->
      <path d="M-25 -25 L-12 25 L-4 -10 L4 25 L12 -25 L4 -30 L-12 -30 Z" fill="#2D89EF"/>
      
      <!-- Paw print -->
      <g transform="translate(25, -12)">
        <ellipse cx="0" cy="5" rx="10" ry="12" fill="#F5A623"/>
        <circle cx="-12" cy="-6" r="5" fill="#F5A623"/>
        <circle cx="-4" cy="-10" r="5" fill="#F5A623"/>
        <circle cx="4" cy="-10" r="5" fill="#F5A623"/>
        <circle cx="12" cy="-6" r="5" fill="#F5A623"/>
      </g>
    </g>
    
    <!-- App title -->
    <text x="0" y="50" font-family="Poppins, Arial, sans-serif" font-size="48" font-weight="700" text-anchor="middle" fill="white" filter="url(#webGlow)">WhoDoggy</text>
    
    <!-- Tagline -->
    <text x="0" y="85" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle" fill="white" opacity="0.9">Professional Dog Microchip Scanner</text>
    
    <!-- Description -->
    <text x="0" y="120" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" opacity="0.8">Instant access to 22 international pet databases</text>
    
    <!-- CTA Button -->
    <g transform="translate(0, 170)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="white" opacity="0.95"/>
      <text x="0" y="5" font-family="Poppins, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#2D89EF">Get Started</text>
    </g>
    
    <!-- Features -->
    <g transform="translate(-200, 250)">
      <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
      <path d="M-3 0 L0 3 L6 -3" stroke="#28A745" stroke-width="2" fill="none"/>
      <text x="20" y="5" font-family="Inter, Arial, sans-serif" font-size="12" fill="white" opacity="0.8">Instant Results</text>
    </g>
    
    <g transform="translate(0, 250)">
      <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
      <path d="M-3 0 L0 3 L6 -3" stroke="#28A745" stroke-width="2" fill="none"/>
      <text x="20" y="5" font-family="Inter, Arial, sans-serif" font-size="12" fill="white" opacity="0.8">22 Databases</text>
    </g>
    
    <g transform="translate(200, 250)">
      <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
      <path d="M-3 0 L0 3 L6 -3" stroke="#28A745" stroke-width="2" fill="none"/>
      <text x="20" y="5" font-family="Inter, Arial, sans-serif" font-size="12" fill="white" opacity="0.8">Secure & Private</text>
    </g>
  </g>
  
  <!-- Decorative elements -->
  <g opacity="0.3">
    <circle cx="100" cy="150" r="30" fill="white" opacity="0.2"/>
    <circle cx="1100" cy="200" r="40" fill="white" opacity="0.15"/>
    <circle cx="150" cy="650" r="25" fill="white" opacity="0.25"/>
    <circle cx="1050" cy="600" r="35" fill="white" opacity="0.2"/>
  </g>
</svg>