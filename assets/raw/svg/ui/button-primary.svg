<svg viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="btnPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D89EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9EF2;stop-opacity:1" />
    </linearGradient>
    <filter id="btnShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Button background -->
  <rect width="200" height="50" rx="25" fill="url(#btnPrimary)" filter="url(#btnShadow)"/>

  <!-- Inner highlight -->
  <rect x="2" y="2" width="196" height="46" rx="23" fill="white" opacity="0.1"/>

  <!-- Button text -->
  <text x="100" y="32" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="white">Scan Microchip</text>

  <!-- Icon -->
  <g transform="translate(25, 25)">
    <rect x="-8" y="-6" width="16" height="12" rx="2" fill="white" opacity="0.8"/>
    <rect x="-6" y="-4" width="12" height="8" rx="1" fill="#2D89EF"/>
    <rect x="-4" y="-2" width="8" height="4" fill="white"/>
  </g>
</svg>
