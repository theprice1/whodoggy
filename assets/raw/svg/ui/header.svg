<svg viewBox="0 0 375 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D89EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A9EF2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Header background -->
  <rect width="375" height="60" fill="url(#headerBg)"/>

  <!-- Status bar area -->
  <rect width="375" height="20" fill="black" opacity="0.1"/>

  <!-- WhoDoggy logo -->
  <g transform="translate(30, 40)">
    <circle cx="0" cy="0" r="12" fill="white" opacity="0.9"/>
    <path d="M-6 -6 L-3 6 L-1 -2 L1 6 L3 -6 L1 -8 L-3 -8 Z" fill="#2D89EF"/>
    <g transform="translate(6, -3)">
      <ellipse cx="0" cy="1" rx="2" ry="2.5" fill="#F5A623"/>
      <circle cx="-2" cy="-1" r="1" fill="#F5A623"/>
      <circle cx="-1" cy="-2" r="1" fill="#F5A623"/>
      <circle cx="1" cy="-2" r="1" fill="#F5A623"/>
      <circle cx="2" cy="-1" r="1" fill="#F5A623"/>
    </g>
  </g>

  <!-- App title -->
  <text x="55" y="44" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" fill="white">WhoDoggy</text>

  <!-- Connection status -->
  <g transform="translate(300, 40)">
    <circle cx="0" cy="0" r="3" fill="#28A745"/>
    <circle cx="0" cy="0" r="2" fill="white"/>
    <text x="15" y="4" font-family="Inter, Arial, sans-serif" font-size="10" fill="white" opacity="0.8">Online</text>
  </g>

  <!-- Menu button -->
  <g transform="translate(345, 40)">
    <line x1="-6" y1="-4" x2="6" y2="-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="-6" y1="4" x2="6" y2="4" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
