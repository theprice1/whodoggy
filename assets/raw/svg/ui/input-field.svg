<svg viewBox="0 0 300 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Input background -->
  <rect width="300" height="60" rx="8" fill="white" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Focus state border -->
  <rect x="1" y="1" width="298" height="58" rx="7" fill="none" stroke="#2D89EF" stroke-width="2" opacity="0"/>

  <!-- Label -->
  <text x="15" y="20" font-family="Inter, Arial, sans-serif" font-size="12" fill="#666" font-weight="500">Microchip Number</text>

  <!-- Input text -->
  <text x="15" y="40" font-family="Monaco, Courier, monospace" font-size="14" fill="#2C3E50">956000012345678</text>

  <!-- Scan icon -->
  <g transform="translate(270, 30)">
    <rect x="-8" y="-6" width="16" height="12" rx="2" fill="#F5A623"/>
    <rect x="-6" y="-4" width="12" height="8" rx="1" fill="white"/>
    <rect x="-5" y="-3" width="2" height="1" fill="#F5A623"/>
    <rect x="-2" y="-3" width="2" height="1" fill="#F5A623"/>
    <rect x="1" y="-3" width="2" height="1" fill="#F5A623"/>
    <rect x="-5" y="-1" width="2" height="1" fill="#F5A623"/>
    <rect x="1" y="-1" width="2" height="1" fill="#F5A623"/>
    <rect x="-5" y="1" width="2" height="1" fill="#F5A623"/>
    <rect x="-2" y="1" width="2" height="1" fill="#F5A623"/>
    <rect x="1" y="1" width="2" height="1" fill="#F5A623"/>
  </g>
</svg>
