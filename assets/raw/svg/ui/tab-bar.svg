<svg viewBox="0 0 375 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="tabShadow">
      <feDropShadow dx="0" dy="-2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Tab bar background -->
  <rect width="375" height="80" fill="white" filter="url(#tabShadow)"/>
  
  <!-- Home tab (active) -->
  <g transform="translate(37.5, 40)">
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="#2D89EF" opacity="0.1"/>
    <path d="M-8 2 L0 -6 L8 2 L8 8 L4 8 L4 2 L-4 2 L-4 8 L-8 8 Z" fill="#2D89EF"/>
    <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2D89EF" font-weight="500">Home</text>
  </g>
  
  <!-- Search tab -->
  <g transform="translate(112.5, 40)">
    <circle cx="0" cy="-5" r="6" fill="none" stroke="#999" stroke-width="2"/>
    <line x1="4" y1="-1" x2="8" y2="3" stroke="#999" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999" font-weight="500">Search</text>
  </g>
  
  <!-- Scan tab (prominent) -->
  <g transform="translate(187.5, 40)">
    <circle cx="0" cy="-8" r="20" fill="#F5A623"/>
    <rect x="-8" y="-14" width="16" height="12" rx="2" fill="white"/>
    <rect x="-6" y="-12" width="12" height="8" rx="1" fill="#F5A623"/>
    <rect x="-5" y="-11" width="2" height="1" fill="white"/>
    <rect x="-2" y="-11" width="2" height="1" fill="white"/>
    <rect x="1" y="-11" width="2" height="1" fill="white"/>
    <rect x="-5" y="-9" width="2" height="1" fill="white"/>
    <rect x="1" y="-9" width="2" height="1" fill="white"/>
    <rect x="-5" y="-7" width="2" height="1" fill="white"/>
    <rect x="-2" y="-7" width="2" height="1" fill="white"/>
    <rect x="1" y="-7" width="2" height="1" fill="white"/>
    <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#F5A623" font-weight="600">Scan</text>
  </g>
  
  <!-- Profile tab -->
  <g transform="translate(262.5, 40)">
    <circle cx="0" cy="-8" r="4" fill="none" stroke="#999" stroke-width="2"/>
    <path d="M-6 4 Q0 0 6 4" stroke="#999" stroke-width="2" fill="none"/>
    <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999" font-weight="500">Profile</text>
  </g>
  
  <!-- Settings tab -->
  <g transform="translate(337.5, 40)">
    <circle cx="0" cy="-5" r="3" fill="none" stroke="#999" stroke-width="1.5"/>
    <path d="M0 -11 L1 -8 L4 -8 L2 -6 L3 -3 L0 -5 L-3 -3 L-2 -6 L-4 -8 L-1 -8 Z" fill="#999"/>
    <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999" font-weight="500">Settings</text>
  </g>
  
  <!-- Indicator -->
  <rect x="170" y="70" width="35" height="3" rx="1.5" fill="#2D89EF"/>
</svg>